<!DOCTYPE html>
<html>
<head>
    <title>Internship Confirmation Form</title>
</head>
<body>

<h2>Internship Availability Confirmation Form</h2>

<form>
    <table>
        <tr>
            <td>Student Name:</td>
            <td>
                <input type="text" name="student_name" required>
            </td>
        </tr>

        <tr>
            <td>Email Address:</td>
            <td>
                <input type="email" name="email" required>
            </td>
        </tr>

        <tr>
            <td>Preferred Internship Type:</td>
            <td>
                <input type="radio" name="internship_type" value="On-Site"> On-Site
                <input type="radio" name="internship_type" value="Remote"> Remote
            </td>
        </tr>

        <tr>
            <td>Internship Duration:</td>
            <td>
                <select name="duration">
                    <option>6 Weeks</option>
                    <option>3 Months</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Skills of Interest:</td>
            <td>
                <input type="checkbox" name="skills" value="Web Development"> Web Development<br>
                <input type="checkbox" name="skills" value="Data Analysis"> Data Analysis<br>
                <input type="checkbox" name="skills" value="Mobile Apps"> Mobile Apps
            </td>
        </tr>

        <tr>
            <td colspan="2" align="left">
                <input type="submit" value="Submit">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
